<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" fill="none" role="img" aria-label="Most used languages for oceanmallik">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#121a2e"/>
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .bar { animation: grow 1s ease-out backwards; }
    @keyframes grow { from { width: 0; } }
  </style>

  <rect x="0.5" y="0.5" width="399" height="319" rx="18" fill="url(#bg)" stroke="url(#border)"/>

  <circle cx="32" cy="34" r="4" fill="#a78bfa"/>
  <text x="44" y="38" font-size="12" font-weight="600" letter-spacing="2" fill="#94a3b8">TOP LANGUAGES</text>
  
  <g>
    <circle cx="32" cy="80" r="5" fill="#f1e05a"/>
    <text x="46" y="84" font-size="14" font-weight="500" fill="#e2e8f0">JavaScript</text>
    <text x="372" y="84" text-anchor="end" font-size="13" fill="#94a3b8">94.2%</text>
    <rect x="28" y="94" width="344" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar" style="animation-delay:0.15s" x="28" y="94" width="323.96" height="6" rx="3" fill="#f1e05a"/>
  </g>
  <g>
    <circle cx="32" cy="118" r="5" fill="#3178c6"/>
    <text x="46" y="122" font-size="14" font-weight="500" fill="#e2e8f0">TypeScript</text>
    <text x="372" y="122" text-anchor="end" font-size="13" fill="#94a3b8">3.3%</text>
    <rect x="28" y="132" width="344" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar" style="animation-delay:0.25s" x="28" y="132" width="11.47" height="6" rx="3" fill="#3178c6"/>
  </g>
  <g>
    <circle cx="32" cy="156" r="5" fill="#555555"/>
    <text x="46" y="160" font-size="14" font-weight="500" fill="#e2e8f0">C</text>
    <text x="372" y="160" text-anchor="end" font-size="13" fill="#94a3b8">1.7%</text>
    <rect x="28" y="170" width="344" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar" style="animation-delay:0.35s" x="28" y="170" width="5.74" height="6" rx="3" fill="#555555"/>
  </g>
  <g>
    <circle cx="32" cy="194" r="5" fill="#3572A5"/>
    <text x="46" y="198" font-size="14" font-weight="500" fill="#e2e8f0">Python</text>
    <text x="372" y="198" text-anchor="end" font-size="13" fill="#94a3b8">0.4%</text>
    <rect x="28" y="208" width="344" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar" style="animation-delay:0.45s" x="28" y="208" width="4" height="6" rx="3" fill="#3572A5"/>
  </g>
  <g>
    <circle cx="32" cy="232" r="5" fill="#7355dd"/>
    <text x="46" y="236" font-size="14" font-weight="500" fill="#e2e8f0">C#</text>
    <text x="372" y="236" text-anchor="end" font-size="13" fill="#94a3b8">0.3%</text>
    <rect x="28" y="246" width="344" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar" style="animation-delay:0.55s" x="28" y="246" width="4" height="6" rx="3" fill="#7355dd"/>
  </g>
  <g>
    <circle cx="32" cy="270" r="5" fill="#f34b7d"/>
    <text x="46" y="274" font-size="14" font-weight="500" fill="#e2e8f0">C++</text>
    <text x="372" y="274" text-anchor="end" font-size="13" fill="#94a3b8">&lt;0.1%</text>
    <rect x="28" y="284" width="344" height="6" rx="3" fill="rgba(255,255,255,0.07)"/>
    <rect class="bar" style="animation-delay:0.65s" x="28" y="284" width="4" height="6" rx="3" fill="#f34b7d"/>
  </g>
  
</svg>
